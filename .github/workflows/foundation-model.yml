name: BabyMind foundation model

on:
  pull_request:
    paths:
      - "foundation/**"
      - ".github/workflows/foundation-model.yml"
  push:
    branches: [main]
    paths:
      - "foundation/**"
      - ".github/workflows/foundation-model.yml"

permissions:
  contents: read

jobs:
  cpu-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: foundation/pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
      - name: Install foundation package and tests
        working-directory: foundation
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: foundation
        run: python -m pytest -q
      - name: Run synthetic CPU benchmark
        working-directory: foundation
        run: python -m babymind_foundation.benchmark --steps 3 --batch-size 1 --sequence-length 32 --threads 2
