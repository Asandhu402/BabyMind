name: BabyMind Linux tests and portable build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_model_test:
        description: Run the expensive real-model installer and GUI smoke test
        type: boolean
        default: false
      chat_test_only:
        description: Run extended production-model GUI questions without the 50-role test
        type: boolean
        default: false
      diagnose_source_only:
        description: Run Ubuntu 22.04 source tests and annotate failures without building the package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || (!inputs.real_model_test && !inputs.chat_test_only && !inputs.diagnose_source_only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '22.04'
            python: '3.11'
          - ubuntu: '24.04'
            python: '3.12'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux desktop test libraries
        run: |
          sudo apt-get update
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            audio_package=libasound2t64
          else
            audio_package=libasound2
          fi
          sudo apt-get install -y xvfb xauth libnss3 libgl1 libegl1 libgbm1 libdrm2 "$audio_package" libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrender1 libxrandr2 libxtst6 libxi6 libxss1 libxshmfence1 libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-render0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build Linux portable directory
        run: ./build-linux.sh
      - name: Test source
        run: |
          .venv/bin/python -m compileall -q src tests
          log="$RUNNER_TEMP/babymind-source-tests.log"
          if .venv/bin/python -m unittest discover -s tests -q >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            .venv/bin/python scripts/ci_acceptance_diagnostics.py "$log" 'Source tests' "$status"
            exit "$status"
          fi
          for file in src/babymind/web/*.js; do node --check "$file"; done
      - name: Exercise llama.cpp with an untrained test fixture
        run: |
          .venv/bin/python -m pip install 'numpy==2.2.6' 'PyYAML==6.0.3'
          PYTHONPATH=build/llama-source/gguf-py .venv/bin/python tests/fixtures/create_random_gguf.py build/random-test.gguf
          BABYMIND_TEST_LLAMA_SERVER="$PWD/dist/BabyMind/llama.cpp/llama-server" BABYMIND_TEST_GGUF_MODEL="$PWD/build/random-test.gguf" .venv/bin/python -m unittest discover -s tests -p test_llama_integration.py -v
      - name: Exercise real Qt window with a local fixture
        env:
          BABYMIND_GUI_TEST: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1' # CI smoke test only; not an app default.
          QT_DEBUG_PLUGINS: '1'
          PYTHONFAULTHANDLER: '1'
        run: |
          log="$RUNNER_TEMP/babymind-qt-smoke.log"
          if xvfb-run -a .venv/bin/python -m unittest discover -s tests -p test_gui_linux.py -v >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            .venv/bin/python scripts/ci_gui_diagnostics.py "$log" "$status"
            exit "$status"
          fi
      - name: Check runtime and packaged assets
        run: |
          test -x dist/BabyMind/BabyMind
          test -x dist/BabyMind/llama.cpp/llama-server
          test -f dist/BabyMind/_internal/babymind/web/index.html
          dist/BabyMind/llama.cpp/llama-server --version
          dist/BabyMind/BabyMind --check-package
          dist/BabyMind/BabyMind --check-desktop-deps
      - name: Exercise packaged source staging in an isolated workspace
        run: dist/BabyMind/BabyMind --check-dev-staging
      - name: Archive without losing executable permissions
        run: tar -C dist -czf dist/BabyMind-Linux-x86_64.tar.gz BabyMind
      - uses: actions/upload-artifact@v4
        with:
          name: BabyMind-Linux-x86_64-ubuntu-${{ matrix.ubuntu }}
          path: dist/BabyMind-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
  diagnose-source:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_source_only
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux desktop test libraries
        run: |
          sudo apt-get update
          if apt-cache show libasound2t64 >/dev/null 2>&1; then audio_package=libasound2t64; else audio_package=libasound2; fi
          sudo apt-get install -y xvfb xauth libnss3 libgl1 libegl1 libgbm1 libdrm2 "$audio_package" libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrender1 libxrandr2 libxtst6 libxi6 libxss1 libxshmfence1 libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-render0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Run source tests with diagnostic annotations
        run: |
          python -m pip install -e '.[build]'
          log="$RUNNER_TEMP/babymind-source-tests.log"
          if python -m unittest discover -s tests -q >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            python scripts/ci_acceptance_diagnostics.py "$log" 'Source tests' "$status"
            exit "$status"
          fi
  real-model-installer:
    # Manual and opt-in: this downloads ~2.71 GB and builds the installer on
    # an ephemeral Ubuntu VM. Xvfb is not a full Ubuntu Desktop session.
    if: github.event_name == 'workflow_dispatch' && (inputs.real_model_test || inputs.chat_test_only)
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Record host and install GUI test tools
        run: |
          cat /etc/os-release
          free -h
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-websocket
      - name: Run the actual installer in a disposable home
        id: installer
        run: |
          mkdir -p "$RUNNER_TEMP/babymind-test-home"
          export HOME="$RUNNER_TEMP/babymind-test-home"
          set +e
          bash ./install-linux.sh 2>&1 | tee "$RUNNER_TEMP/babymind-installer.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-installer.log" Installer "$status"
            exit "$status"
          fi
      - name: Exercise installed Qt GUI and real-model response under Xvfb
        env:
          EXTENDED_CHAT: ${{ inputs.chat_test_only }}
        run: |
          export HOME="$RUNNER_TEMP/babymind-test-home"
          args=("$HOME/.local/bin/babymind" --log "$RUNNER_TEMP/babymind-desktop.log")
          if [[ "$EXTENDED_CHAT" == 'true' ]]; then
            args+=(--extended-chat --report "$RUNNER_TEMP/babymind-chat-report.json")
          fi
          set +e
          xvfb-run -a /usr/bin/python3 scripts/verify_installed_desktop.py \
            "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/babymind-gui-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-gui-test.log" GUI "$status"
            exit "$status"
          fi
      - name: Exercise real model roles, coding, and disposable source self-edit
        if: ${{ !cancelled() && steps.installer.outcome == 'success' && !inputs.chat_test_only }}
        run: |
          export HOME="$RUNNER_TEMP/babymind-test-home"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/acceptance-venv"
          "$RUNNER_TEMP/acceptance-venv/bin/python" -m pip install 'cryptography>=50,<51'
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$RUNNER_TEMP/acceptance-venv/bin/python" \
            scripts/verify_real_model_roles.py --home "$HOME" --workdir "$RUNNER_TEMP" \
            --report "$RUNNER_TEMP/babymind-real-model-report.json" 2>&1 | tee "$RUNNER_TEMP/babymind-roles-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-roles-test.log" Roles "$status"
            exit "$status"
          fi
      - name: Upload extended chat report
        if: ${{ !cancelled() && inputs.chat_test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: babymind-gui-chat-report
          path: ${{ runner.temp }}/babymind-chat-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload disposable test report
        if: ${{ !cancelled() && steps.installer.outcome == 'success' && !inputs.chat_test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: babymind-real-model-test-report
          path: ${{ runner.temp }}/babymind-real-model-report.json
          if-no-files-found: warn
          retention-days: 7
