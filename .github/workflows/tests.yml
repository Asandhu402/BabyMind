name: BabyMind Linux tests and portable build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # No dispatch switches: every trigger runs exactly the same, complete set of
  # jobs, so nothing can be left untested by choosing the wrong one.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      # BabyMind is Debian-based x86-64 only and is tested on Ubuntu 26.10, so
      # the portable artifact needs glibc 2.43 (Ubuntu 26.04+). Every supported
      # interpreter is exercised: 3.13 is the supported floor and 3.15 is the
      # current stable release. NOTE: GitHub does not yet publish an
      # ubuntu-26.10 hosted runner label; these jobs require a matching
      # self-hosted runner (or a future GitHub label) until one is available.
      matrix:
        include:
          - ubuntu: '26.10'
            python: '3.13'
          - ubuntu: '26.10'
            python: '3.14'
          - ubuntu: '26.10'
            python: '3.15'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Allow unprivileged user namespaces for the sandbox backend
        # Ubuntu 24.04+ restricts unprivileged user namespaces with AppArmor, so
        # babymind.sandbox would report no backend and the suite would fail.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Linux desktop test libraries
        run: |
          sudo apt-get update
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            audio_package=libasound2t64
          else
            audio_package=libasound2
          fi
          sudo apt-get install -y xvfb xauth libnss3 libgl1 libegl1 libgbm1 libdrm2 "$audio_package" libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrender1 libxrandr2 libxtst6 libxi6 libxss1 libxshmfence1 libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-render0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build Linux portable directory
        run: ./build-linux.sh
      - name: Test source
        run: |
          .venv/bin/python -m compileall -q src tests
          log="$RUNNER_TEMP/babymind-source-tests.log"
          if .venv/bin/python -m unittest discover -s tests -q >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            .venv/bin/python scripts/ci_acceptance_diagnostics.py "$log" 'Source tests' "$status"
            exit "$status"
          fi
          for file in src/babymind/web/*.js; do node --check "$file"; done
      - name: Exercise llama.cpp with an untrained test fixture
        run: |
          .venv/bin/python -m pip install 'numpy==2.2.6' 'PyYAML==6.0.3'
          PYTHONPATH=build/llama-source/gguf-py .venv/bin/python tests/fixtures/create_random_gguf.py build/random-test.gguf
          BABYMIND_TEST_LLAMA_SERVER="$PWD/dist/BabyMind/llama.cpp/llama-server" BABYMIND_TEST_GGUF_MODEL="$PWD/build/random-test.gguf" .venv/bin/python -m unittest discover -s tests -p test_llama_integration.py -v
      - name: Exercise real Qt window with a local fixture
        env:
          BABYMIND_GUI_TEST: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1' # CI smoke test only; not an app default.
          QT_DEBUG_PLUGINS: '1'
          PYTHONFAULTHANDLER: '1'
        run: |
          log="$RUNNER_TEMP/babymind-qt-smoke.log"
          if xvfb-run -a .venv/bin/python -m unittest discover -s tests -p test_gui_linux.py -v >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            .venv/bin/python scripts/ci_gui_diagnostics.py "$log" "$status"
            exit "$status"
          fi
      - name: Check runtime and packaged assets
        run: |
          test -x dist/BabyMind/BabyMind
          test -x dist/BabyMind/llama.cpp/llama-server
          test -f dist/BabyMind/_internal/babymind/web/index.html
          dist/BabyMind/llama.cpp/llama-server --version
          dist/BabyMind/BabyMind --check-package
          dist/BabyMind/BabyMind --check-desktop-deps
      - name: Exercise packaged source staging in an isolated workspace
        run: |
          log="$RUNNER_TEMP/babymind-packaged-staging.log"
          if dist/BabyMind/BabyMind --check-dev-staging >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            .venv/bin/python scripts/ci_acceptance_diagnostics.py "$log" 'Packaged staging' "$status"
            exit "$status"
          fi
      - name: Archive without losing executable permissions
        run: tar -C dist -czf dist/BabyMind-Linux-x86_64.tar.gz BabyMind
      - uses: actions/upload-artifact@v4
        with:
          name: BabyMind-Linux-x86_64-ubuntu-${{ matrix.ubuntu }}
          path: dist/BabyMind-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
  source-latest:
    # Cheap source-only check on Ubuntu 26.10, the Debian-based x86-64 release
    # BabyMind is tested on (glibc 2.43), so the portable build is not the only
    # data point for Python 3.15.
    runs-on: ubuntu-26.10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Allow unprivileged user namespaces for the sandbox backend
        # Ubuntu 24.04+ restricts unprivileged user namespaces with AppArmor, so
        # babymind.sandbox would report no backend and the suite would fail.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Python dependencies
        run: python -m pip install -e .
      - name: Test source
        run: |
          python -m compileall -q src tests
          log="$RUNNER_TEMP/babymind-source-tests.log"
          set +e
          python -m unittest discover -s tests -q >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            # Publish the failing traceback as a check annotation, which stays
            # readable even when the job log is not retrievable.
            python scripts/ci_acceptance_diagnostics.py "$log" 'Source tests' "$status"
            exit "$status"
          fi
          for file in src/babymind/web/*.js; do node --check "$file"; done
  bootstrap:
    # The one-command entry point, on a runner with no project Python set up:
    # bootstrap-linux.sh must prepare the machine by itself.
    runs-on: ubuntu-26.10
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare this machine with the one-command bootstrap
        run: bash bootstrap-linux.sh --prepare-only
      - name: Show the plan the bootstrap would follow
        run: |
          bash bootstrap-linux.sh --dry-run | tee "$RUNNER_TEMP/plan.txt"
          grep -q "Plan (dry run, nothing was changed)" "$RUNNER_TEMP/plan.txt"
          grep -q "Using apt-get" "$RUNNER_TEMP/plan.txt"
  bootstrap-plan:
    # A distribution whose Python is too old must plan the python.org source
    # build instead of stopping. Ubuntu 24.04 ships Python 3.12, below the
    # 3.13 floor (this job cannot run on 26.10, whose Python is supported).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Plan the source-build fallback
        run: |
          bash bootstrap-linux.sh --dry-run | tee "$RUNNER_TEMP/plan.txt"
          grep -q "would build CPython" "$RUNNER_TEMP/plan.txt"
          grep -q "Using apt-get" "$RUNNER_TEMP/plan.txt"
  real-model-installer:
    # Permanent, not opt-in: the pinned model is the application's brain, so
    # every push and every pull request must prove that the real installer,
    # the real ~2.71 GB model and real CPU inference still work together. This
    # is the most expensive job in the workflow: it downloads ~2.71 GB, builds
    # the installer, drives the installed desktop through the full extended
    # question set and runs a 50-role mission on an ephemeral Ubuntu VM. Xvfb
    # is not a full Ubuntu Desktop session.
    concurrency:
      # A newer commit on the same branch or pull request supersedes this run,
      # so a model download and 50-role mission are never stacked up. The
      # newest commit still runs the job, so nothing goes untested.
      group: real-model-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # The installer requires Python 3.13+, which Ubuntu 26.10 provides (3.14).
    runs-on: ubuntu-26.10
    # Recorded runs needed 60-71 minutes for the 50-role mission alone, on top
    # of the download, the build and the extended GUI question set.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Record host and install GUI test tools
        run: |
          cat /etc/os-release
          free -h
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-websocket
      - name: Run the actual installer in a disposable home
        id: installer
        run: |
          mkdir -p "$RUNNER_TEMP/babymind-test-home"
          export HOME="$RUNNER_TEMP/babymind-test-home"
          set +e
          bash ./install-linux.sh 2>&1 | tee "$RUNNER_TEMP/babymind-installer.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-installer.log" Installer "$status"
            exit "$status"
          fi
      - name: Exercise the installed Qt GUI with the full real-model question set
        run: |
          export HOME="$RUNNER_TEMP/babymind-test-home"
          set +e
          xvfb-run -a /usr/bin/python3 scripts/verify_installed_desktop.py \
            "$HOME/.local/bin/babymind" --log "$RUNNER_TEMP/babymind-desktop.log" \
            --extended-chat --report "$RUNNER_TEMP/babymind-chat-report.json" \
            2>&1 | tee "$RUNNER_TEMP/babymind-gui-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-gui-test.log" GUI "$status"
            exit "$status"
          fi
      - name: Exercise real model roles, coding, and disposable source self-edit
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: |
          export HOME="$RUNNER_TEMP/babymind-test-home"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/acceptance-venv"
          "$RUNNER_TEMP/acceptance-venv/bin/python" -m pip install 'cryptography>=50,<51'
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$RUNNER_TEMP/acceptance-venv/bin/python" \
            scripts/verify_real_model_roles.py --home "$HOME" --workdir "$RUNNER_TEMP" \
            --report "$RUNNER_TEMP/babymind-real-model-report.json" 2>&1 | tee "$RUNNER_TEMP/babymind-roles-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            /usr/bin/python3 scripts/ci_acceptance_diagnostics.py "$RUNNER_TEMP/babymind-roles-test.log" Roles "$status"
            exit "$status"
          fi
      - name: Upload the GUI question report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: babymind-gui-chat-report
          path: ${{ runner.temp }}/babymind-chat-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the real-model acceptance report
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: babymind-real-model-test-report
          path: ${{ runner.temp }}/babymind-real-model-report.json
          if-no-files-found: warn
          retention-days: 7
