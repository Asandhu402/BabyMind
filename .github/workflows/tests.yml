name: BabyMind tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BabyMind
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check browser JavaScript syntax
        run: node --check src/babymind/web/app.js; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check src/babymind/web/approvals.js
        shell: pwsh
      - name: Audit installed Python dependencies
        run: python -m pip install pip-audit; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python -m pip_audit
        shell: pwsh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
