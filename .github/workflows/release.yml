name: BabyMind Linux release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release version
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Release tag must use semantic versioning, e.g. v0.5.0.")
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match pyproject.toml version {version}.")
          PY
      - name: Install, compile, audit and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build pip-audit
          python -m compileall -q src tests
          node --check src/babymind/web/app.js
          node --check src/babymind/web/approvals.js
          python -m pip_audit
          python -m unittest discover -s tests -v
      - name: Build Python distributions
        run: python -m build
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish Linux release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: BabyMind ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*
