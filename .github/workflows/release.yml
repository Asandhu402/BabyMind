name: BabyMind Linux release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching pyproject.toml, e.g. v0.6.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Validate version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$TAG" == "v$VERSION" ]]
      - name: Build and test
        run: |
          ./build-linux.sh
          .venv/bin/python -m unittest discover -s tests -q
          dist/BabyMind/llama.cpp/llama-server --version
          dist/BabyMind/BabyMind --check-package
      - name: Archive and checksum
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tar -C dist -czf "dist/BabyMind-Linux-x86_64-$TAG.tar.gz" BabyMind
          (cd dist && sha256sum "BabyMind-Linux-x86_64-$TAG.tar.gz" > "BabyMind-Linux-x86_64-$TAG.tar.gz.sha256")
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/BabyMind-Linux-x86_64-${{ inputs.tag }}.tar.gz
            dist/BabyMind-Linux-x86_64-${{ inputs.tag }}.tar.gz.sha256
