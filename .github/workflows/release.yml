name: BabyMind Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test native Windows workspace broker prototype
        shell: pwsh
        run: |
          cmake -S native/windows_workspace -B build/native-workspace -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-workspace --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/native-workspace -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run BabyMind tests
        shell: pwsh
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows application
        shell: pwsh
        run: ./build-windows.ps1
      - name: Package and checksum portable application
        shell: pwsh
        run: |
          $package = "dist/BabyMind-Windows-Portable-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "dist/BabyMind" -DestinationPath $package -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content -Path "$package.sha256" -Encoding ASCII
          Write-Host "Created $package"
          Write-Host "SHA-256: $hash"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: BabyMind ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/BabyMind-Windows-Portable-${{ env.RELEASE_TAG }}.zip
            dist/BabyMind-Windows-Portable-${{ env.RELEASE_TAG }}.zip.sha256
