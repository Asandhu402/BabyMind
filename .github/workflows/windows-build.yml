name: BabyMind Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable desktop application
        shell: pwsh
        run: ./build-windows.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: BabyMind-Windows-Portable
          path: dist/BabyMind/
          if-no-files-found: error
          retention-days: 14
