name: BabyMind Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test native Windows workspace broker prototype
        shell: pwsh
        run: |
          cmake -S native/windows_workspace -B build/native-workspace -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-workspace --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/native-workspace -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable desktop application
        shell: pwsh
        run: ./build-windows.ps1
      - name: Run unit tests on Windows (including DPAPI)
        run: python -m unittest discover -s tests -v
      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: BabyMind-Windows-Portable
          path: dist/BabyMind/
          if-no-files-found: error
          retention-days: 14
