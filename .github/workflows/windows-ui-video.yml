name: BabyMind Windows UI video demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/babymind/web/**"
      - "src/babymind/**"
      - "scripts/record_ui_demo.py"
      - ".github/workflows/windows-ui-video.yml"
  push:
    branches: [main]
    paths:
      - "src/babymind/web/**"
      - "src/babymind/**"
      - ".github/workflows/windows-ui-video.yml"

permissions:
  contents: read

concurrency:
  group: babymind-ui-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-ui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install BabyMind and browser recorder
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install chromium

      - name: Restore verified pinned model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/babymind-demo.gguf
          key: babymind-model-79e28ecacf84e75b6056cf4059636d435aa9eb67795780f7b7dbc7d32a962741

      - name: Restore verified llama.cpp archive cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llama-cpu.zip
          key: babymind-llama-b11960-73f962f82850d244db47eaacb9d913637027b82399124324298576d58c5f4287

      - name: Download (if needed) and verify pinned model and llama.cpp runtime
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "babymind-demo.gguf"
          $url = "https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive/resolve/55e05aba5a4e1e2d6c4919753a68941c4ad4cb11/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf?download=true"
          if (Test-Path -LiteralPath $model -PathType Leaf) {
            Write-Host "Found cached model; verifying SHA-256..."
          } else {
            Write-Host "Model cache miss; downloading pinned model..."
            Invoke-WebRequest -Uri $url -OutFile $model -TimeoutSec 1800
          }
          $actual = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "79e28ecacf84e75b6056cf4059636d435aa9eb67795780f7b7dbc7d32a962741") {
            Remove-Item -LiteralPath $model -Force -ErrorAction SilentlyContinue
            throw "Model SHA-256 verification failed: $actual"
          }

          $zip = Join-Path $env:RUNNER_TEMP "llama-cpu.zip"
          $extract = Join-Path $env:RUNNER_TEMP "llama-cpu"
          if (Test-Path -LiteralPath $zip -PathType Leaf) {
            Write-Host "Found cached llama.cpp archive; verifying SHA-256..."
          } else {
            Write-Host "llama.cpp cache miss; downloading pinned CPU runtime..."
            Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b11960/llama-b11960-bin-win-cpu-x64.zip" -OutFile $zip
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "73f962f82850d244db47eaacb9d913637027b82399124324298576d58c5f4287") {
            Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
            throw "llama.cpp archive SHA-256 verification failed: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $server = Get-ChildItem -Path $extract -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in verified archive." }
          "BABYMIND_DEMO_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_DEMO_LLAMA=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_CONTEXT_SIZE=8192" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_TEMPERATURE=0.35" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_TOP_P=0.9" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_MAX_TOKENS=512" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Save verified pinned model cache
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/babymind-demo.gguf
          key: babymind-model-79e28ecacf84e75b6056cf4059636d435aa9eb67795780f7b7dbc7d32a962741

      - name: Save verified llama.cpp archive cache
        if: success() && steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llama-cpu.zip
          key: babymind-llama-b11960-73f962f82850d244db47eaacb9d913637027b82399124324298576d58c5f4287

      - name: Start and verify local llama.cpp model
        shell: pwsh
        run: |
          $llamaLog = Join-Path $env:RUNNER_TEMP "llama-demo.log"
          $serverArgs = @("--model", "`"$env:BABYMIND_DEMO_MODEL`"", "--host", "127.0.0.1", "--port", "1235", "--ctx-size", "8192", "--threads", "4", "--n-gpu-layers", "0") -join " "
          $llama = Start-Process -FilePath $env:BABYMIND_DEMO_LLAMA -ArgumentList $serverArgs -PassThru -NoNewWindow -RedirectStandardOutput $llamaLog -RedirectStandardError (Join-Path $env:RUNNER_TEMP "llama-demo.err")
          "BABYMIND_LLAMA_PID=$($llama.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ready = $false
          for ($i=0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 5
            if ($llama.HasExited) { throw "Local model process exited. $llamaLog" }
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:1235/health" -TimeoutSec 5
              if ($h.status -eq "ok") { $ready=$true; break }
            } catch {}
          }
          if (-not $ready) { throw "Local model did not become ready within 15 minutes." }

      - name: Record actual BabyMind interface and model response
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python scripts/record_ui_demo.py
          if ($LASTEXITCODE -ne 0) { throw "Browser recording failed." }

      - name: Stop local processes
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("BABYMIND_UI_PID","BABYMIND_LLAMA_PID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload UI video and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BabyMind-Real-Windows-UI-Video
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
