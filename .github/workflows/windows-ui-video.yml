name: BabyMind Windows UI video demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/babymind/web/**"
      - "src/babymind/**"
      - ".github/workflows/windows-ui-video.yml"
  push:
    branches: [main]
    paths:
      - "src/babymind/web/**"
      - "src/babymind/**"
      - ".github/workflows/windows-ui-video.yml"

permissions:
  contents: read

concurrency:
  group: babymind-ui-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-ui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install BabyMind and browser recorder
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install chromium

      - name: Download pinned model and llama.cpp CPU runtime
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "babymind-demo.gguf"
          $url = "https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive/resolve/55e05aba5a4e1e2d6c4919753a68941c4ad4cb11/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf?download=true"
          Invoke-WebRequest -Uri $url -OutFile $model -TimeoutSec 1800
          $actual = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "79e28ecacf84e75b6056cf4059636d435aa9eb67795780f7b7dbc7d32a962741") {
            throw "Model SHA-256 verification failed: $actual"
          }

          $zip = Join-Path $env:RUNNER_TEMP "llama-cpu.zip"
          $extract = Join-Path $env:RUNNER_TEMP "llama-cpu"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b11960/llama-b11960-bin-win-cpu-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "73f962f82850d244db47eaacb9d913637027b82399124324298576d58c5f4287") {
            throw "llama.cpp archive SHA-256 verification failed: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $server = Get-ChildItem -Path $extract -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in verified archive." }
          "BABYMIND_DEMO_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BABYMIND_DEMO_LLAMA=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start local model and BabyMind web UI
        shell: pwsh
        run: |
          $llamaLog = Join-Path $env:RUNNER_TEMP "llama-demo.log"
          $serverArgs = @("--model", "`"$env:BABYMIND_DEMO_MODEL`"", "--host", "127.0.0.1", "--port", "1235", "--ctx-size", "2048", "--threads", "4", "--n-gpu-layers", "0") -join " "
          $llama = Start-Process -FilePath $env:BABYMIND_DEMO_LLAMA -ArgumentList $serverArgs -PassThru -NoNewWindow -RedirectStandardOutput $llamaLog -RedirectStandardError (Join-Path $env:RUNNER_TEMP "llama-demo.err")
          "BABYMIND_LLAMA_PID=$($llama.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ready = $false
          for ($i=0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 5
            if ($llama.HasExited) { throw "Local model process exited. $llamaLog" }
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:1235/health" -TimeoutSec 5
              if ($h.status -eq "ok") { $ready=$true; break }
            } catch {}
          }
          if (-not $ready) { throw "Local model did not become ready within 15 minutes." }
          $env:BABYMIND_ENGINE = "llama.cpp"
          $env:BABYMIND_LLAMA_SERVER = $env:BABYMIND_DEMO_LLAMA
          $env:BABYMIND_GGUF_MODEL = $env:BABYMIND_DEMO_MODEL
          $env:BABYMIND_CONTEXT_SIZE = "2048"
          $env:BABYMIND_HOME = (Join-Path $env:RUNNER_TEMP "babymind-demo-data")
          $app = Start-Process -FilePath python -ArgumentList "-m babymind.server --host 127.0.0.1 --port 8765 --no-browser" -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "babymind-ui.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "babymind-ui.err")
          "BABYMIND_UI_PID=$($app.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $up=$false
          for ($i=0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { Invoke-WebRequest "http://127.0.0.1:8765" -UseBasicParsing -TimeoutSec 3 | Out-Null; $up=$true; break } catch {}
          }
          if (-not $up) { throw "BabyMind UI server did not start." }

      - name: Record actual BabyMind interface and model response
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python scripts/record_ui_demo.py
          if ($LASTEXITCODE -ne 0) { throw "Browser recording failed." }

      - name: Stop local processes
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("BABYMIND_UI_PID","BABYMIND_LLAMA_PID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload UI video and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BabyMind-Real-Windows-UI-Video
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
