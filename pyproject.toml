[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babymind"
version = "0.5.0"
description = "Local-first personal AI workspace with 50 specialist roles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=5.0,<7",
    "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]
documents = ["docling>=2.0"]
voice = ["faster-whisper>=1.0"]
browser = ["browser-use>=0.11; python_version >= '3.11'"]
knowledge-graph = ["cognee[gliner]>=0.5.0"]
all-integrations = [
    "docling>=2.0",
    "faster-whisper>=1.0",
    "browser-use>=0.11; python_version >= '3.11'",
    "cognee[gliner]>=0.5.0",
]

[project.scripts]
babymind = "babymind.cli:main"
babymind-web = "babymind.server:main"
babymind-desktop = "babymind.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
babymind = ["web/*"]
