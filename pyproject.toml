[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babymind"
version = "0.5.0"
description = "Local-first personal AI workspace with 50 specialist roles (experimental, not production-ready)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "PySide6>=6.12,<7",
    "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22.3,<7"]
documents = ["docling>=2.0"]
voice = ["faster-whisper>=1.0"]
browser = ["browser-use>=0.11; python_version >= '3.11'"]
knowledge-graph = ["cognee[gliner]>=0.5.0"]
all-integrations = [
    "docling>=2.0",
    "faster-whisper>=1.0",
    "browser-use>=0.11; python_version >= '3.11'",
    "cognee[gliner]>=0.5.0",
]

[project.scripts]
babymind = "babymind.cli:main"
babymind-web = "babymind.server:main"
babymind-desktop = "babymind.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
babymind = ["web/*"]
